<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Eventos culturais gratuitos">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Eventos culturais gratuitos</title>

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="bg-pattern" aria-hidden="true"></div>

  <header class="site-header">
    <div class="header-inner">
      <h1>Eventos culturais gratuitos</h1>
      <div class="header-actions">
        <button id="btn-notif" class="btn btn-ghost" type="button" title="Notificações">🔔</button>
        <button id="btn-add" class="btn btn-primary" type="button">＋ Adicionar</button>
      </div>
    </div>
  </header>

  <main>
    <section class="filters" aria-label="Filtros">
      <div class="filter-group">
        <button class="chip active" data-filter="all">Todos</button>
        <button class="chip" data-filter="hoje">Hoje</button>
        <button class="chip" data-filter="semana">Esta semana</button>
        <button class="chip" data-filter="proximos">30 dias</button>
      </div>
      <div class="search-wrap">
        <input type="search" id="search" placeholder="Pesquisar…" aria-label="Pesquisar">
      </div>
    </section>

    <section id="eventos" class="eventos-lista" aria-live="polite"></section>

    <p id="empty-state" class="empty-state hidden">
      Ainda não há eventos.
    </p>
  </main>

  <!-- Modal -->
  <dialog id="modal-add" class="modal">
    <form id="form-evento" method="dialog">
      <header class="modal-header">
        <h2 id="modal-title">Novo evento</h2>
        <button type="button" class="btn-close" id="btn-close-modal" aria-label="Fechar">×</button>
      </header>

      <div class="modal-body">
        <div class="form-grid">
          <div class="field full">
            <label for="titulo">Nome do evento *</label>
            <input type="text" id="titulo" name="titulo" required maxlength="120" placeholder="Ex: Concerto no jardim">
          </div>

          <div class="field">
            <label for="data">Data *</label>
            <input type="date" id="data" name="data" required>
          </div>

          <div class="field">
            <label for="hora">Hora *</label>
            <input type="time" id="hora" name="hora" required>
          </div>

          <div class="field full">
            <label for="local">Local *</label>
            <input type="text" id="local" name="local" required maxlength="100" placeholder="Ex: Jardim da Estrela, Lisboa">
          </div>

          <div class="field full">
            <label for="maps">Link Google Maps</label>
            <input type="url" id="maps" name="maps" placeholder="https://maps.google.com/...">
          </div>

          <div class="field">
            <label for="categoria">Categoria</label>
            <select id="categoria" name="categoria">
              <option value="Música">Música</option>
              <option value="Teatro">Teatro</option>
              <option value="Cinema">Cinema</option>
              <option value="Exposição">Exposição</option>
              <option value="Literatura">Literatura</option>
              <option value="Dança">Dança</option>
              <option value="Workshops">Workshops</option>
              <option value="Outro">Outro</option>
            </select>
          </div>

          <div class="field">
            <label for="preco">Preço</label>
            <input type="text" id="preco" name="preco" value="Gratuito" maxlength="40">
          </div>

          <div class="field full">
            <label for="descricao">Notas</label>
            <textarea id="descricao" name="descricao" rows="3" maxlength="500" placeholder="O que levar, restrições, etc."></textarea>
          </div>

          <div class="field full">
            <label for="organizador">Organizador</label>
            <input type="text" id="organizador" name="organizador" maxlength="80">
          </div>
        </div>
      </div>

      <footer class="modal-footer">
        <button type="button" class="btn btn-ghost" id="btn-cancel">Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar</button>
      </footer>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/app.js" type="module"></script>
</body>
</html>
